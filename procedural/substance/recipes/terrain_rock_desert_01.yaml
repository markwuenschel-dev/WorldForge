# terrain_rock_desert_01.yaml
# Example recipe for the terrain_rock_strata.sbs master graph
# This file is safe for agents to duplicate and modify (within allowed parameter ranges)
# Conforms to docs/contracts/material_recipe_contract.md v1.1

schema_version: "1.1"
id: terrain_rock_desert_01
graph: terrain_rock_strata.sbs
resolution: 2048

parameters:
  base_hue: 0.08        # Warm desert tone
  saturation: 0.42
  value: 0.58

  crack_density: 0.72
  crack_depth: 0.45
  strata_angle: 18.0
  erosion_strength: 0.63
  sand_overlay: 0.28

outputs:
  base_color: T_Terrain_Rock_Desert_01_BC
  normal: T_Terrain_Rock_Desert_01_N
  roughness: T_Terrain_Rock_Desert_01_R
  ambient_occlusion: T_Terrain_Rock_Desert_01_AO
  height: T_Terrain_Rock_Desert_01_H

ue:
  parent_material: /Game/Materials/Masters/M_Terrain_Master
  instance_path: /Game/Materials/Terrain/MI_Terrain_Rock_Desert_01
  texture_folder: Textures/Terrain
  texture_group: World
  compression:
    base_color: Default
    normal: Normalmap
    masks: Masks
  generate_data_asset: true
  data_asset_class: MaterialRecipeDataAsset

# Notes for agents:
# - Duplicate this file for new variants
# - Only change values under "parameters"
# - Keep id, graph, resolution, outputs, and ue sections structurally identical unless contract changes
# - After editing, run: make validate-recipe RECIPE=terrain_rock_desert_01