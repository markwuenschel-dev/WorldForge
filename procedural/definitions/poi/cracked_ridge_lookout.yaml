schema_version: "1.0"
recipe_id: cracked_ridge_lookout
display_name: "Cracked Ridge Lookout"
biome: desert
description: "Elevated vantage point on cracked ridge terrain."

compatible_terrain:
  - ash_flats

compatible_state:
  - clean
  - ruined_industrial

compatible_placement:
  - rocky_basin
  - dead_scrub

footprint:
  width_cm: 2500
  depth_cm: 2500

bounds:
  id: primary_bounds
  require_non_overlapping: true

anchors:
  - id: summit
    role: lookout
    offset_cm: [0, 0, 300]
  - id: approach_path
    role: approach
    offset_cm: [0, -1200, 0]
  - id: fallback_cover
    role: secondary
    offset_cm: [-600, 400, 100]

markers:
  - id: primary_poi_marker
    role: objective_focus
    anchor_ref: summit
  - id: approach_marker
    role: entry_focus
    anchor_ref: approach_path

budgets:
  max_static_mesh_actors: 25
  max_marker_count: 8
  max_bounds_area_cm2: 10000000

template_id: cracked_ridge_lookout_template_v1
seed: 42004
