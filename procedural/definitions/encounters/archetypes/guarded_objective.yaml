schema_version: '1.4'
encounter_archetype: guarded_objective
display_name: Guarded Objective
intent: Enemies or hazards guard a mission objective anchor.
required_elements:
- objective_link
- spawn_anchors
- cover_anchors
- approach_route
- escape_route
- completion_condition
roles:
- guard
- ranged_pressure
spawn_groups:
  light_pressure: 1
  standard_pressure: 2
count_range:
  light_pressure:
  - 2
  - 4
  standard_pressure:
  - 3
  - 6
requires_resource_node: false
requires_hazard: false
cover_required: true
escape_route_required: true
bypass_allowed: false
spawn_policy: pre_placed
