name: lowvis_render
kind: rendering
# --- required (frozen) contract fields ---
rendering_mode: balanced
gi_method: lumen
ray_tracing: 'off'
shadow_quality: medium
# --- pipeline detail ---
reflection_method: ssr
anti_aliasing: TSR
nanite: true
lumen: true
# --- v1.0x rendering-budget enrichment (Agent 6) ---
# Low-visibility render: heavy volumetric fog is intentional, but ray tracing is
# OFF so the fog cost is not compounded by RT (see validate_raytracing frame-risk).
virtual_shadow_maps: true
volumetric_fog: heavy
material_complexity_class: medium
texture_budget_class: medium
mesh_density_class: medium
foliage_density_class: low
post_process_cost_class: medium
light_count_budget: 16
fog_volume_budget: 3
high_cost_material_budget: 6
foliage_cluster_budget: 10
cost_class: 3
