world_pack_id: biome_expansion_world
description: >
  Environment/visual-profile binding overlay for the biome_expansion_world pack.
  Binds every slice_id to a materially-real, biome-appropriate environment
  profile under procedural/definitions/profiles/environment/. As each biome's
  slice pack + environment composites land, its slice_ids are added here — no
  silent fallback in strict mode. default_environment_profile is itself validated.

default_environment_profile: photoreal_forest_day

