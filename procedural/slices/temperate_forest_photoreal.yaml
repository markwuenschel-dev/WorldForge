# temperate_forest_photoreal.yaml
# BiomeForge v1.1 variant template — temperate_forest, photoreal env mode.
# Mirrors desert_sandy.yaml shape (recipes / placement_definitions / state /
# render). References Agent 2's temperate_forest surface families. The env
# profile itself is assigned per-slice by the binding overlay
# (procedural/definitions/profiles/bindings/biome_expansion_world.yaml); this
# template only records the biome-appropriate terrain/placement/state surface.
#
# Safe for agents to duplicate/modify. Keep state.before/after within [0.0, 1.0].

schema_version: "1.0"
id: temperate_forest_photoreal
biome: temperate_forest
variant: photoreal

map: /Game/WorldForge/Maps/Temperate_Forest_Photoreal_01

recipes:
  - terrain_forest_temperate_01
placement_definitions:
  - woodland_scatter

state:
  scope: Region
  context_id: Temperate_Forest_Photoreal_01
  key: canopy_growth
  before: 0.0
  after: 0.5

render:
  # mossy_soil family (procedural/definitions/materials/biomes/temperate_forest/mossy_soil.yaml)
  terrain_mi: /Game/WorldForge/Generated/Materials/Terrain/MI_Terrain_Forest_01
  preview_base_color: [0.22, 0.28, 0.14]   # linear 0-1 forest floor (mossy_soil)
  placement_data_asset: /Game/WorldForge/Generated/Placement/DA_Woodland_Foliage
  resolution: [1600, 900]
  seed: 424301

acceptance:
  mpc_parameter: CanopyGrowth
  foliage_increases:
    - fern
    - understory
  foliage_decreases:
    - clearing_grass

output_dir: procedural/reports/slices/temperate_forest_photoreal
