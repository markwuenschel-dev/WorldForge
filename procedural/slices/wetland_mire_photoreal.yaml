  terrain_mi: /Game/WorldForge/Generated/Materials/Terrain/MI_Terrain_Wetland_01
  preview_base_color: [0.20, 0.16, 0.11]   # linear 0-1 saturated wet mud
  placement_data_asset: /Game/WorldForge/Generated/Placement/DA_Wetland_Foliage
