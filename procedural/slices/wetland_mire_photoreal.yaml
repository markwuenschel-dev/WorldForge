# Mirrors temperate_forest_photoreal.yaml shape. References Agent 2's
# wetland_mire surface families (wet_mud). Env profile is assigned per-slice by
# the binding overlay; this template records the surface only.
#
# Safe for agents to duplicate/modify. Keep state.before/after within [0.0, 1.0].

