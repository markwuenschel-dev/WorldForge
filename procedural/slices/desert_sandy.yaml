# desert_sandy.yaml
# Biome slice variant: same map / master material / PCG graph / state key as
# desert_industrialized -- only the terrain material preset changes (sand instead
# of cracked rock). This is the Phase 2 "choose a variant" proof:
#   make biome-slice BIOME=desert VARIANT=sandy
#
# Safe for agents to duplicate/modify. Keep state.before/after within [0.0, 1.0].

schema_version: "1.0"
id: desert_sandy
biome: desert
variant: sandy

map: /Game/Maps/Desert_Valley_01

recipes:
  - terrain_sand_desert_01
placement_definitions:
  - reclaimed_desert_foliage

state:
  scope: Region
  context_id: Desert_Valley_01
  key: industrial_pressure
  before: 0.0
  after: 0.75

render:
  terrain_mi: /Game/Materials/Terrain/MI_Terrain_Sand_Desert_01
  preview_base_color: [0.40, 0.28, 0.14]   # linear 0-1 fallback tint for headless preview
  placement_data_asset: /Game/Procedural/Placement/DA_ReclaimedDesert_Foliage
  resolution: [1600, 900]
  seed: 424242

acceptance:
  mpc_parameter: IndustrialPressure
  foliage_increases:
    - dead_scrub
  foliage_decreases:
    - reclaimed_grass
    - young_tree

output_dir: procedural/reports/slices/desert_sandy
