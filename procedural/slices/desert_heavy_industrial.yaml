# desert_heavy_industrial.yaml
# Biome slice variant: same map / master material / PCG graph / state key as
# desert_industrialized -- the maxed-out soot look. Uses the ash-darkened rock
# preset and pushes the state axis to full pressure. Phase 2 "choose a variant"
# proof:
#   make biome-slice BIOME=desert VARIANT=heavy_industrial
#
# Safe for agents to duplicate/modify. Keep state.before/after within [0.0, 1.0].

schema_version: "1.0"
id: desert_heavy_industrial
biome: desert
variant: heavy_industrial

map: /Game/Maps/Desert_Valley_01

recipes:
  - terrain_rock_desert_ash_01
placement_definitions:
  - reclaimed_desert_foliage

state:
  scope: Region
  context_id: Desert_Valley_01
  key: industrial_pressure
  before: 0.0
  after: 1.00      # full industrial pressure

render:
  terrain_mi: /Game/Materials/Terrain/MI_Terrain_Rock_Desert_Ash_01
  preview_base_color: [0.13, 0.11, 0.10]   # linear 0-1 fallback tint for headless preview
  placement_data_asset: /Game/Procedural/Placement/DA_ReclaimedDesert_Foliage
  resolution: [1600, 900]
  seed: 424242

acceptance:
  mpc_parameter: IndustrialPressure
  foliage_increases:
    - dead_scrub
  foliage_decreases:
    - reclaimed_grass
    - young_tree

output_dir: procedural/reports/slices/desert_heavy_industrial
