# desert_clean.yaml
# Biome slice variant: same map / master material / PCG graph / state key as
# desert_industrialized -- the bright, unsoiled desert look. Reuses the base
# rock preset but with a lighter preview tint. Phase 2 "choose a variant" proof:
#   make biome-slice BIOME=desert VARIANT=clean
#
# Safe for agents to duplicate/modify. Keep state.before/after within [0.0, 1.0].

schema_version: "1.0"
id: desert_clean
biome: desert
variant: clean

map: /Game/Maps/Desert_Valley_01

recipes:
  - terrain_rock_desert_01
placement_definitions:
  - reclaimed_desert_foliage

state:
  scope: Region
  context_id: Desert_Valley_01
  key: industrial_pressure
  before: 0.0
  after: 0.75

render:
  terrain_mi: /Game/Materials/Terrain/MI_Terrain_Rock_Desert_01
  preview_base_color: [0.46, 0.40, 0.30]   # linear 0-1 fallback tint for headless preview
  placement_data_asset: /Game/Procedural/Placement/DA_ReclaimedDesert_Foliage
  resolution: [1600, 900]
  seed: 424242

acceptance:
  mpc_parameter: IndustrialPressure
  foliage_increases:
    - dead_scrub
  foliage_decreases:
    - reclaimed_grass
    - young_tree

output_dir: procedural/reports/slices/desert_clean
