# desert_ash.yaml
# Biome slice variant: same map / master material / PCG graph / state key as
# desert_industrialized -- only the terrain material preset changes (ash-darkened
# rock). The runtime soot axis still lives in M_Terrain_Master state; this is the
# baked-base look, not the runtime soot. Phase 2 "choose a variant" proof:
#   make biome-slice BIOME=desert VARIANT=ash
#
# Safe for agents to duplicate/modify. Keep state.before/after within [0.0, 1.0].

schema_version: "1.0"
id: desert_ash
biome: desert
variant: ash

map: /Game/Maps/Desert_Valley_01

recipes:
  - terrain_rock_desert_ash_01
placement_definitions:
  - reclaimed_desert_foliage

state:
  scope: Region
  context_id: Desert_Valley_01
  key: industrial_pressure
  before: 0.0
  after: 0.75

render:
  terrain_mi: /Game/Materials/Terrain/MI_Terrain_Rock_Desert_Ash_01
  preview_base_color: [0.09, 0.085, 0.08]   # linear 0-1 fallback tint for headless preview
  placement_data_asset: /Game/Procedural/Placement/DA_ReclaimedDesert_Foliage
  resolution: [1600, 900]
  seed: 424242

acceptance:
  mpc_parameter: IndustrialPressure
  foliage_increases:
    - dead_scrub
  foliage_decreases:
    - reclaimed_grass
    - young_tree

output_dir: procedural/reports/slices/desert_ash
