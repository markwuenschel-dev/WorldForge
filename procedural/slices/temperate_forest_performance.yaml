# temperate_forest_performance.yaml
# BiomeForge v1.1 variant template — temperate_forest, performance-safe env mode.
# Mirrors desert_sandy.yaml shape. References Agent 2's temperate_forest
# surface families (forest_path). Env profile is assigned per-slice by the
# binding overlay; this template records the biome-appropriate surface.
#
# Safe for agents to duplicate/modify. Keep state.before/after within [0.0, 1.0].

schema_version: "1.0"
id: temperate_forest_performance
biome: temperate_forest
variant: performance

map: /Game/WorldForge/Maps/Temperate_Forest_Performance_01

recipes:
  - terrain_forest_temperate_01
placement_definitions:
  - woodland_scatter

state:
  scope: Region
  context_id: Temperate_Forest_Performance_01
  key: canopy_growth
  before: 0.0
  after: 0.5

render:
  # forest_path family (procedural/definitions/materials/biomes/temperate_forest/forest_path.yaml)
  terrain_mi: /Game/WorldForge/Generated/Materials/Terrain/MI_Terrain_Forest_01
  preview_base_color: [0.34, 0.29, 0.20]   # linear 0-1 compacted trail
  placement_data_asset: /Game/WorldForge/Generated/Placement/DA_Woodland_Foliage
  resolution: [1600, 900]
  seed: 424303

acceptance:
  mpc_parameter: CanopyGrowth
  foliage_increases:
    - fern
    - understory
  foliage_decreases:
    - clearing_grass

output_dir: procedural/reports/slices/temperate_forest_performance
