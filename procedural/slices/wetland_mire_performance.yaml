# wetland_mire_performance.yaml
# BiomeForge v1.1 variant template — wetland_mire, performance-safe env mode.
# Mirrors temperate_forest_performance.yaml shape. References Agent 2's
# wetland_mire surface families (peat). Env profile is assigned per-slice by the
# binding overlay; this template records the surface only.
#
# Safe for agents to duplicate/modify. Keep state.before/after within [0.0, 1.0].

schema_version: "1.0"
id: wetland_mire_performance
biome: wetland_mire
variant: performance

map: /Game/WorldForge/Maps/Wetland_Mire_Performance_01

recipes:
  - terrain_wetland_mire_01
placement_definitions:
  - marsh_scatter

state:
  scope: Region
  context_id: Wetland_Mire_Performance_01
  key: water_level
  before: 0.0
  after: 0.5

render:
  # peat family (procedural/definitions/materials/biomes/wetland_mire/peat.yaml)
  terrain_mi: /Game/WorldForge/Generated/Materials/Terrain/MI_Terrain_Wetland_01
  preview_base_color: [0.14, 0.11, 0.08]   # linear 0-1 dark peat
  placement_data_asset: /Game/WorldForge/Generated/Placement/DA_Wetland_Foliage
  resolution: [1600, 900]
  seed: 514103

acceptance:
  mpc_parameter: WaterLevel
  foliage_increases:
    - reeds
    - low_marsh_grass
  foliage_decreases:
    - dry_tussock

output_dir: procedural/reports/slices/wetland_mire_performance
