name: WorldForge Contracts (Tier 0 + Tier 1)

# Agent-operability gates that run on hosted CI with NO Unreal Engine
# (forge_design_decisions D7). Tier 2 / Tier 3 (require UE) are local/self-hosted
# pre-merge gates and are intentionally NOT run here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    name: Tier 0 + Tier 1 (no UE)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for diff/provenance)
        uses: actions/checkout@v4
        with:
          # Need history so check_agent_permissions.py can diff against origin/main
          # and generate_manifest.py can resolve the source commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      # --- Tier 1: tooling compiles ---
      - name: py_compile all tools
        run: |
          python -m py_compile $(find tools -name "*.py")

      # --- Tier 1: no YAML in UE scripts (mirror `make pre-ue-audit`) ---
      - name: Assert no YAML usage in tools/unreal
        run: |
          if grep -R "import yaml" tools/unreal/; then
            echo "ERROR: 'import yaml' found in tools/unreal/ (UE scripts must not depend on pyyaml)."
            exit 1
          fi
          if grep -R "yaml.safe_load" tools/unreal/; then
            echo "ERROR: 'yaml.safe_load' found in tools/unreal/ (UE scripts must not depend on pyyaml)."
            exit 1
          fi
          echo "OK: no YAML usage in tools/unreal/"

      # --- Tier 1: the one valid recipe must pass ---
      - name: Validate recipe (terrain_rock_desert_01)
        run: |
          python tools/substance/validate_recipe.py --recipe terrain_rock_desert_01

      # --- Tier 1: manifest generates and carries provenance + data_asset_path ---
      - name: Generate manifest
        run: |
          python tools/pipeline/generate_manifest.py --recipe terrain_rock_desert_01

      - name: Assert manifest JSON validity + provenance block
        run: |
          python - <<'PY'
          import json, sys

          path = "procedural/manifests/materials/terrain_rock_desert_01.json"
          with open(path, "r", encoding="utf-8") as f:
              manifest = json.load(f)  # fails loudly if not valid JSON

          prov = manifest.get("provenance")
          assert isinstance(prov, dict), "manifest missing 'provenance' block"

          required_prov = [
              "generator_name",
              "generated_at_utc",
              "source_commit",
              "source_tree_dirty",
              "inputs",
          ]
          missing = [k for k in required_prov if k not in prov]
          assert not missing, f"provenance missing keys: {missing}"

          data_asset_path = manifest.get("ue", {}).get("data_asset_path")
          assert data_asset_path, "manifest missing ue.data_asset_path"

          print("OK: manifest is valid JSON with a complete provenance block.")
          print("    provenance keys:", sorted(prov.keys()))
          print("    ue.data_asset_path:", data_asset_path)
          PY

      # --- Tier 1: every invalid fixture must be rejected ---
      - name: Negative recipe tests
        run: |
          python tools/pipeline/test_negative_recipes.py

      # --- Tier 0: forbidden-path check on the PR diff (informational) ---
      - name: Agent permission check (PR diff)
        run: |
          python tools/pipeline/check_agent_permissions.py --changed-against origin/main

      # --- Tier 1: Makefile build target dry-run parses ---
      - name: Makefile build dry-run sanity
        run: |
          make -n build RECIPE=terrain_rock_desert_01
